# /etc/pure-ftpd/pure-ftpd.conf — CentOS Web Panel (fake-cwp, TEST ONLY), docs/cwp/pure-ftpd.conf.txt. Not running.
ChrootEveryone               yes
BrokenClientsCompatibility   no
MaxClientsNumber             50
Daemonize                    yes
MaxClientsPerIP              8
VerboseLog                   no
DisplayDotFiles              yes
AnonymousOnly                no
NoAnonymous                  no
SyslogFacility               ftp
DontResolve                  yes
MaxIdleTime                  15
PureDB /etc/pure-ftpd/pureftpd.pdb
PAMAuthentication    yes
UnixAuthentication       yes
LimitRecursion               10000 8
AnonymousCanCreateDirs       no
MaxLoad                      4
PassivePortRange             45000 50000
AntiWarez                    yes
Umask                        133:022
MinUID                       1000
AllowUserFXP                 no
AllowAnonymousFXP            no
ProhibitDotFilesWrite        no
ProhibitDotFilesRead         no
AutoRename                   no
AnonymousCantUpload          yes
AltLog                       clf:/var/log/pureftpd.log
MaxDiskUsage                   99
CustomerProof                yes
TLS 1
TLSCipherSuite HIGH:MEDIUM:+TLSv1:!SSLv2:!SSLv3
CertFile /etc/pki/tls/private/hostname.pem
