# /etc/dovecot/dovecot.conf — CentOS Web Panel (fake-cwp, TEST ONLY), rebuilt from `doveconf -n` of
# the source (docs/cwp/dovecot-n.txt). Dovecot is NOT running: only `doveconf -n` must answer.
protocols = imap pop3 lmtp sieve
listen = *
auth_mechanisms = plain login
disable_plaintext_auth = no
first_valid_gid = 12
first_valid_uid = 101
mail_location = maildir:/var/vmail/%d/%n
mail_plugins = quota
lda_mailbox_autocreate = yes
lda_mailbox_autosubscribe = yes
lmtp_save_to_detail_mailbox = yes
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
debug_log_path = /var/log/dovecot-debug.log
managesieve_notify_capability = mailto
managesieve_sieve_capability = fileinto reject envelope encoded-character vacation subaddress comparator-i;ascii-numeric relational regex imap4flags copy include variables body enotify environment mailbox date index ihave duplicate mime foreverypart extracttext

ssl_cert = </etc/pki/tls/certs/hostname.bundle
ssl_key = </etc/pki/tls/private/hostname.key

dict {
  quotadict = mysql:/etc/dovecot/dovecot-dict-quota.conf
}

namespace inbox {
  inbox = yes
  location =
  prefix =
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Spam {
    auto = subscribe
    autoexpunge = 30 days
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    autoexpunge = 30 days
    special_use = \Trash
  }
}

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-mysql.conf
}
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-token.conf
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-mysql.conf
}

plugin {
  acl = vfile:/etc/dovecot/acls
  quota = dict:user::proxy::quotadict
  sieve = ~/dovecot.sieve
  sieve_before = /var/sieve/globalfilter.sieve
  sieve_dir = ~/sieve
  sieve_global_dir = /var/sieve/
  sieve_global_path = /var/sieve/globalfilter.sieve
  sieve_max_script_size = 1M
  trash = /etc/dovecot/trash.conf
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    group = postfix
    mode = 0660
    user = postfix
  }
  unix_listener auth-userdb {
    group = mail
    mode = 0660
    user = vmail
  }
}
service dict {
  unix_listener dict {
    group = mail
    mode = 0666
    user = vmail
  }
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_limit = 500
}
service imap {
  vsz_limit = 256 M
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    group = postfix
    mode = 0600
    user = postfix
  }
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
  process_min_avail = 0
  service_count = 1
  vsz_limit = 64 M
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

protocol lda {
  mail_plugins = quota sieve
  postmaster_address = postmaster@srvdomain.test
}
protocol imap {
  imap_client_workarounds = delay-newmail
  mail_plugins = quota imap_quota trash
}
protocol lmtp {
  mail_plugins = quota sieve
}
protocol pop3 {
  mail_plugins = quota
  pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
}
protocol sieve {
  managesieve_implementation_string = Dovecot Pigeonhole
  managesieve_max_compile_errors = 5
  managesieve_max_line_length = 64 k
}

# SNI per domain (local_name mail.<d> webmail.<d>), generated with the certificates.
!include_try /etc/dovecot/sni.conf
