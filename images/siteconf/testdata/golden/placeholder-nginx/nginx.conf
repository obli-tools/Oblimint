# ─────────────────────────────────────────────────────────────────────────────
# Generated by siteconf from /etc/oblimint/site/primary.json — DO NOT EDIT (re-rendered by
# oblimint-entrypoint / oblimint-reload). Site 77, role secondary, base nginx-php8.4.
#
# Runs as an arbitrary non-root uid on a read-only root filesystem: pid and
# temp files live under /run/oblimint and /tmp/nginx (tmpfs); logs go to stdout/stderr.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes 2;
pid /run/oblimint/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    log_format oblimint '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout oblimint;

    # The edge (oblimint-edge) and the panel reach the site over the private
    # account network: trust their X-Forwarded-For / X-Forwarded-Proto.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    map $http_x_forwarded_proto $oblimint_https {
        default "";
        https on;
    }
    map $http_x_forwarded_proto $oblimint_port {
        default 80;
        https 443;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        # Redirects keep the client's host and never expose :8080.
        absolute_redirect off;
        port_in_redirect off;

        location = /__oblimint/ping {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # ── PLACEHOLDER MODE ─────────────────────────────────────────────────
        # /srv/releases/current/public does not exist yet (no release published): every
        # request answers 503 + Retry-After with the built-in page. PHP is never used.
        error_page 503 /__oblimint/placeholder.html;
        location = /__oblimint/placeholder.html {
            internal;
            default_type text/html;
            alias /usr/share/oblimint/placeholder.html;
            add_header Retry-After 30 always;
            add_header Cache-Control "no-store" always;
        }
        location / {
            return 503;
        }
    }
}
