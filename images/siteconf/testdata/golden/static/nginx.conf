# ─────────────────────────────────────────────────────────────────────────────
# Generated by siteconf from /etc/oblimint/site/primary.json — DO NOT EDIT (re-rendered by
# oblimint-entrypoint / oblimint-reload). Site 5, role primary, base nginx-static.
#
# Runs as an arbitrary non-root uid on a read-only root filesystem: pid and
# temp files live under /run/oblimint and /tmp/nginx (tmpfs); logs go to stdout/stderr.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes 2;
pid /run/oblimint/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    log_format oblimint '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout oblimint;

    # The edge (oblimint-edge) and the panel reach the site over the private
    # account network: trust their X-Forwarded-For / X-Forwarded-Proto.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    map $http_x_forwarded_proto $oblimint_https {
        default "";
        https on;
    }
    map $http_x_forwarded_proto $oblimint_port {
        default 80;
        https 443;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        # Redirects keep the client's host and never expose :8080.
        absolute_redirect off;
        port_in_redirect off;

        location = /__oblimint/ping {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        root /srv/releases/current/dist;
        index index.html index.htm;

        # Hidden files (.git, .env, .htaccess…) are never served.
        location ~ /\.(?!well-known/) {
            return 404;
        }

        # Data path dist/downloads (persistent) — never executed.
        location ^~ /downloads/ {
            location ~* \.(php[0-9]?|phar|phtml|pht|phps)(/|$) {
                return 403;
            }
            location ~ /\. {
                return 404;
            }
        }

        # Site owner's custom rules (validated by siteconf, then `nginx -t`).
        include /run/oblimint/custom.conf;

        # Platform 404 page for the 404s nginx produces itself (missing file).
        # After the custom rules: their own error_page 404 is matched first;
        # the 404 pages of the application (PHP, no fastcgi_intercept_errors) pass.
        error_page 404 /__oblimint/404.html;
        location = /__oblimint/404.html {
            internal;
            default_type text/html;
            alias /usr/share/oblimint/404.html;
        }
        location / {
            try_files $uri $uri/ =404;
        }

        # Static base: PHP sources are never served (no interpreter here).
        location ~* \.(php[0-9]?|phar|phtml|pht|phps|inc)(/|$) {
            return 403;
        }
    }
}
