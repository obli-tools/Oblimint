; ─────────────────────────────────────────────────────────────────────────────
; Generated by siteconf from /etc/oblimint/site/primary.json — DO NOT EDIT (re-rendered by
; oblimint-entrypoint / oblimint-reload; `kill -USR2` re-reads it).
; Site 40, role preview, base apache-php8.1.
;
; Non-root master (no user/group directives), foreground, logs to stderr.
; ─────────────────────────────────────────────────────────────────────────────

[global]
pid = /run/oblimint/php-fpm.pid
error_log = /proc/self/fd/2
log_level = notice
daemonize = no

[site]
listen = /run/php-fpm.sock
listen.mode = 0600

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
request_terminate_timeout = 150s

; Only *.php is ever executed (a .jpg sent to the pool is refused).
security.limit_extensions = .php

; Security — php_admin_value: neither ini_set() nor .user.ini can change these.
; /opt/oblimint/ only holds the guard (auto_prepend_file is subject to open_basedir).
php_admin_value[open_basedir] = /srv/releases/:/srv/data/:/tmp/:/opt/oblimint/
php_admin_value[auto_prepend_file] = /opt/oblimint/guard.php
; oblimint_exec: PHP is only compiled (main script AND include/require) from
; these real-path prefixes — never from /tmp, typed or user-content data paths.
php_admin_value[oblimint.exec_dirs] = "/srv/releases/:/opt/oblimint/:/srv/data/var/cache/"
php_admin_value[session.save_path] = /tmp/sessions
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_flag[allow_url_include] = off

; Site settings (panel « PHP » tab). php_value: the application may raise
; them itself (WordPress raises memory_limit for its admin, for instance).
php_value[memory_limit] = 512M
php_value[upload_max_filesize] = 32M
php_value[post_max_size] = 48M
php_value[max_execution_time] = 120
php_value[max_input_time] = 120
