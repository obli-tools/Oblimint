#
# Generated by siteconf from /etc/oblimint/site/primary.json — DO NOT EDIT.
# Site 12, role primary, base litespeed-php8.3 — virtual host of OpenLiteSpeed.
#

# ── PLACEHOLDER MODE ─────────────────────────────────────────────────────────
# /srv/releases/current does not exist yet (no release published): every request
# answers 503 + Retry-After with the built-in page. PHP is never used.
docRoot                     /usr/share/oblimint/empty/
enableGzip                  1

accesslog /tmp/lsws/logs/access.log {
    useServer               0
    rollingSize             0
    logReferer              1
    logUserAgent            1
}

errorPage 503 {
    url                     /__oblimint/placeholder.html
}

rewrite {
    enable                  1
    autoLoadHtaccess        0
    rules                   <<<END_rules
RewriteCond %{REQUEST_URI} !^/__oblimint/
RewriteRule ^ - [R=503,L]
END_rules
}

context exp:^/__oblimint/ping$ {
    location                /usr/share/oblimint/ping
    allowBrowse             1
    forceType               text/plain
    rewrite {
        enable              0
    }
}

context exp:^/__oblimint/placeholder\.html$ {
    location                /usr/share/oblimint/placeholder.html
    allowBrowse             1
    extraHeaders            <<<END_extraHeaders
Retry-After: 30
Cache-Control: no-store
END_extraHeaders
    rewrite {
        enable              0
    }
}
