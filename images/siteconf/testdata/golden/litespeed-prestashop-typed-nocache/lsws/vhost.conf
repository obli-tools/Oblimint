#
# Generated by siteconf from /etc/oblimint/site/primary.json — DO NOT EDIT.
# Site 40, role preview, base litespeed-php8.1 — virtual host of OpenLiteSpeed.
#

# Release (read-only mount). .htaccess files: OpenLiteSpeed reads their
# REWRITE rules only (at the first request of a directory, again after each
# graceful restart — every publication / rollback reloads).
docRoot                     /srv/releases/current/
enableGzip                  1

# Access log of the site (a FIFO copied to the container's stdout).
accesslog /tmp/lsws/logs/access.log {
    useServer               0
    rollingSize             0
    logReferer              1
    logUserAgent            1
}

index {
    useServer               0
    indexFiles              index.php, index.html, index.htm
    autoIndex               0
}

# Platform 404 page for the 404s OpenLiteSpeed produces itself (missing file);
# the 404 pages of the application (PHP) pass. (ErrorDocument of .htaccess
# files is not read by OpenLiteSpeed.)
errorPage 404 {
    url                     /__oblimint/404.html
}

rewrite {
    enable                  1
    autoLoadHtaccess        1
}

# ── Built-in pages (ping, 404) ──────────────────────────────────────────────
context exp:^/__oblimint/ping$ {
    location                /usr/share/oblimint/ping
    allowBrowse             1
    forceType               text/plain
    rewrite {
        enable              0
    }
}

context exp:^/__oblimint/(404\.html)$ {
    location                /usr/share/oblimint/$1
    allowBrowse             1
    rewrite {
        enable              0
    }
}

# Hidden files (.htaccess, .user.ini, .git, .env…) are never served; /.well-known/ is.
context exp:(?:/\.(?!well-known(/|$))) {
    allowBrowse             0
}

# Never source-disclose / run PHP variants other than .php.
context exp:(?i)\.(php[0-9]|phar|phtml|pht|phps)(/|$) {
    allowBrowse             0
}

# ── Data paths: writable by PHP, NEVER executed, no .htaccess read ───────────
# Root regex contexts: matched before OpenLiteSpeed walks the directories, so
# a .htaccess written by PHP under /srv/data is never loaded.

# Data path img (typed: jpeg, jpg, png, svg, webp) — never executed, no .htaccess read.
context exp:(?i)^/img/.*\.(php[0-9]?|phar|phtml|pht|phps)(/|$) {
    allowBrowse             0
}
context exp:(?i)^/img/(.*\.(?:jpeg|jpg|png|svg|webp))$ {
    location                /srv/releases/current/img/$1
    allowBrowse             1
    rewrite {
        enable              0
    }
}
context exp:^/img/ {
    allowBrowse             0
    rewrite {
        enable              0
    }
}

# Data path themes/cache (typed: nothing served) — never executed, no .htaccess read.
context exp:(?i)^/themes/cache/.*\.(php[0-9]?|phar|phtml|pht|phps)(/|$) {
    allowBrowse             0
}
context exp:^/themes/cache/ {
    allowBrowse             0
    rewrite {
        enable              0
    }
}

# Data path upload (persistent) — never executed, no .htaccess read.
context exp:(?i)^/upload/.*\.(php[0-9]?|phar|phtml|pht|phps)(/|$) {
    allowBrowse             0
}
context exp:^/upload/(.*)$ {
    location                /srv/releases/current/upload/$1
    allowBrowse             1
    rewrite {
        enable              0
    }
}

# Data path var/cache (ephemeral) — never executed, no .htaccess read.
context exp:(?i)^/var/cache/.*\.(php[0-9]?|phar|phtml|pht|phps)(/|$) {
    allowBrowse             0
}
context exp:^/var/cache/(.*)$ {
    location                /srv/releases/current/var/cache/$1
    allowBrowse             1
    rewrite {
        enable              0
    }
}
