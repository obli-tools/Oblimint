# ─────────────────────────────────────────────────────────────────────────────
# Oblimint — Apache of the shared SnappyMail (non-root, port 8080, code in
# /opt/snappymail, read-only; data in /var/lib/snappymail, never served).
# ─────────────────────────────────────────────────────────────────────────────
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /opt/snappymail>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>

# Only the front controller and the static assets are reachable.
<LocationMatch "^/(\.|data|_data_|include\.php|_include\.php|snappymail/v/[^/]+/(app|include\.php))(/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "(^\.|\.(sh|md|ini|json|log|lock)$)">
    Require all denied
</FilesMatch>
