# Generated by Oblimint (postfix-dovecot) — Dovecot configuration. Do not edit: rewritten at every sync.
protocols = imap pop3 lmtp sieve
listen = *
base_dir = /run/dovecot
state_dir = /var/lib/oblimint-mail/dovecot
instance_name = oblimint-mail
log_path = /dev/stderr
info_log_path = /dev/stdout
log_timestamp = "%Y-%m-%dT%H:%M:%SZ "
login_greeting = Mail server ready.

# Authentication (MA1, MA6)
auth_mechanisms = plain login
auth_username_format = %Lu
auth_failure_delay = 2 secs
auth_verbose = no
auth_verbose_passwords = no
disable_plaintext_auth = yes
login_trusted_networks = 172.20.128.0/17 172.20.64.0/18 172.20.32.0/19 172.20.16.0/20 172.20.8.0/21 172.20.4.0/22 172.20.2.0/23 172.20.1.0/24 172.20.0.128/25 172.20.0.64/26 172.20.0.32/27 172.20.0.16/28 172.20.0.8/29 172.20.0.4/30 172.20.0.2/31 172.20.0.0/32
passdb {
  driver = passwd-file
  args = username_format=%Lu /run/oblimint-mail/live/dovecot/passwd
}
passdb {
  driver = passwd-file
  args = username_format=%Lu /run/oblimint-mail/live/dovecot/apppasswords.0
}
userdb {
  driver = passwd-file
  args = username_format=%Lu /run/oblimint-mail/live/dovecot/users
  default_fields = uid=5000 gid=5000 home=/var/vmail/%d/%n
}

# TLS (>= 1.2); per-name certificates by SNI
ssl = required
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
ssl_cert = </etc/oblimint/mail-certs/mail.oblimint.test/fullchain.pem
ssl_key = </etc/oblimint/mail-certs/mail.oblimint.test/privkey.pem
ssl_dh = </usr/share/oblimint-mail/dh.pem
local_name autoconfig.exemple.fr {
  ssl_cert = </etc/oblimint/mail-certs/mail.exemple.fr/fullchain.pem
  ssl_key = </etc/oblimint/mail-certs/mail.exemple.fr/privkey.pem
}
local_name mail.exemple.fr {
  ssl_cert = </etc/oblimint/mail-certs/mail.exemple.fr/fullchain.pem
  ssl_key = </etc/oblimint/mail-certs/mail.exemple.fr/privkey.pem
}
local_name mail.oblimint.test {
  ssl_cert = </etc/oblimint/mail-certs/mail.oblimint.test/fullchain.pem
  ssl_key = </etc/oblimint/mail-certs/mail.oblimint.test/privkey.pem
}

# Mail storage (vmail 5000:5000, CWP layout)
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000
mail_uid = 5000
mail_gid = 5000
mail_home = /var/vmail/%d/%n
mail_location = maildir:/var/vmail/%d/%n/Maildir
mail_plugins = $mail_plugins quota
namespace inbox {
  inbox = yes
  separator = .
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
postmaster_address = postmaster@mail.oblimint.test
hostname = mail.oblimint.test
lmtp_rcpt_check_quota = yes
# Sieve vacation / redirect: SMTP to Postfix (loopback listener), never sendmail -> postdrop (see the header)
submission_host = 127.0.0.1:10026

# Services
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
  }
}
service quota-status {
  executable = quota-status -p postfix
  inet_listener {
    address = 127.0.0.1
    port = 12340
  }
  client_limit = 1
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 20
}
protocol pop3 {
  pop3_uidl_format = %08Xu%08Xv
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

plugin {
  quota = count:User quota
  quota_vsizes = yes
  quota_grace = 10%%
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_max_script_size = 1M
  sieve_max_actions = 32
  sieve_max_redirects = 4
  sieve_redirect_envelope_from = recipient
  sieve_vacation_min_period = 1d
  sieve_vacation_default_period = 7d
  sieve_vacation_max_period = 30d
}
