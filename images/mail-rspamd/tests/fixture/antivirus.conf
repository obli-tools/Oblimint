# Generated by Oblimint (postfix-dovecot) — Rspamd antivirus (shared scanner, clamd TCP). Do not edit: rewritten at every sync.
# Messages above 32 MiB (settings scanner.maxFileSizeMb) are not sent to ClamAV.
clamav {
  type = "clamav";
  servers = "oblimint-scanner:3310";
  symbol = "CLAM_VIRUS";
  action = "reject";
  message = '${SCANNER}: virus found: "${VIRUS}"';
  scan_mime_parts = false;
  max_size = 33554432;
  timeout = 30;
  retransmits = 2;
  log_clean = false;
}
