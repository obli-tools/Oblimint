# ─────────────────────────────────────────────────────────────────────────────
# oblimint-mail-relay: Dovecot as the SASL backend of Postfix ONLY (no IMAP /
# POP3 / LMTP listener). Credentials = /etc/oblimint/relay/passwd, written by
# the panel: one line per enabled site, "site-<id>:{SHA512-CRYPT}$6$…" (the
# clear credential only exists in the site's msmtprc and, sealed, in the
# panel database — MA4). Re-read by Dovecot when the file changes.
# ─────────────────────────────────────────────────────────────────────────────
# protocols = none: no listener at all (an empty `listen =` is refused by
# Dovecot 2.3.21: "listen can't be set empty").
protocols = none
base_dir = /run/dovecot
state_dir = /run/dovecot-state
log_path = /dev/stderr
info_log_path = /dev/stderr
# No TLS listener at all (SASL socket only, over the private Docker network):
# the 2.3 default ssl = yes would make doveconf fail without ssl_cert.
ssl = no
# Plain over the private Docker network (msmtp "auth plain", "tls off").
disable_plaintext_auth = no
auth_mechanisms = plain login
auth_failure_delay = 2 secs
auth_cache_size = 0
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%Lu /etc/oblimint/relay/passwd
}
userdb {
  driver = static
  args = uid=nobody gid=nobody home=/nonexistent
}
# passwd is 0640 root:relayd (gid 2525): the auth process (user dovecot) reads it through that group.
service auth {
  extra_groups = relayd
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
# No CAP_SYS_CHROOT in the container: anvil runs unchrooted (it holds no secret).
service anvil {
  chroot =
}
