# ─────────────────────────────────────────────────────────────────────────────
# oblimint-edge — shared reverse proxy (P1-PLAN §11). Baked at
# /etc/nginx/nginx.conf; the panel (module edge) only writes the vhosts in
# /etc/nginx/oblimint/conf.d/*.conf (mounted read-only) and runs
#   docker exec oblimint-edge nginx -t   then   nginx -s reload
#
# Master as root (binds 80/443, reads the root-owned private keys), workers
# as `nginx`. Container: CapDrop ALL + CHOWN, NET_BIND_SERVICE, SETGID,
# SETUID; no-new-privileges; read-only root with tmpfs /var/cache/nginx,
# /run, /tmp.
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log stderr warn;
# File descriptors per worker: > 2 x worker_connections (a proxied request
# holds a client and an upstream socket). The container runs with
# nofile 65536:65536 (server specs.ts EDGE_NOFILE_LIMIT, keep >= this value):
# without CAP_SYS_RESOURCE nginx cannot raise its hard limit itself.
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Read-only root: temp files on the /var/cache/nginx tmpfs.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    # Long / numerous host names (one vhost per domain + www + previews).
    # A name is up to 253 characters (panel SERVER_NAME_RE): one hash entry is
    # ~264 bytes, so 128/256-byte buckets would fail `nginx -t` on a long name.
    # Going past max_size does NOT fail `nginx -t`: ngx_hash_init() then only
    # WARNS ("could not build optimal server_names_hash … ignoring
    # server_names_hash_bucket_size") and builds a 65536-bucket hash anyway;
    # EMERG needs one bucket chain > ~64 KB (millions of names). A high vhost
    # count costs lookup speed, it cannot wedge the global configuration test.
    server_names_hash_bucket_size 512;
    server_names_hash_max_size 65536;
    map_hash_bucket_size 128;

    # Docker embedded DNS: vhosts proxy_pass through VARIABLES, resolved per
    # request, so a stopped site container never breaks `nginx -t`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # WebSocket upgrade (name used by the generated vhosts: keep it).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Access log: ONE JSON object per request on stdout ────────────────────
    # Contract docs/P2-PLAN.md §6.8 (produced here, parsed by the panel:
    # services/usage/edgeLog.ts parseEdgeLogLine — traffic per site / account /
    # tenant, per-site access logs and live tail). Exact line:
    #   {"time":"<ISO 8601>","host":"…","remote_addr":"…","method":"…","uri":"…",
    #    "status":<int>,"bytes":<int body>,"bytes_sent":<int total>,
    #    "request_length":<int>,"request_time":<float s>,"upstream":"…",
    #    "upstream_status":"…","user_agent":"…","referer":"…","site":"<id>|",
    #    "account":"<id>|","tenant":"<id>|","kind":"<kind>"}
    # site / account / tenant are decimal ids or "" (panel, platform hosts,
    # default servers); kind ∈ site | secondary | preview | panel | placeholder |
    # dbadmin | probe | redirect | default. The four $oblimint_* variables are
    # set (rewrite `set`) in EVERY location of the generated vhosts
    # (server/src/services/edge/nginxConfig.ts) and of the default servers
    # below — which also declares them for `nginx -t` when conf.d is empty.
    # The internal error-page locations set nothing: an error_page redirect
    # keeps the values of the location that failed.
    uninitialized_variable_warn off;
    log_format oblimint_json escape=json '{"time":"$time_iso8601","host":"$host","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"bytes_sent":$bytes_sent,"request_length":$request_length,"request_time":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status","user_agent":"$http_user_agent","referer":"$http_referer","site":"$oblimint_site","account":"$oblimint_account","tenant":"$oblimint_tenant","kind":"$oblimint_kind"}';
    access_log /dev/stdout oblimint_json;

    # TLS defaults (Mozilla "intermediate"); vhosts repeat the protocols.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    # Same zone name / size as the generated vhosts (one shared cache).
    ssl_session_cache shared:oblimint_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Default HTTP server: ACME challenges, then 404 ───────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            set $oblimint_kind default;
            set $oblimint_site "";
            set $oblimint_account "";
            set $oblimint_tenant "";
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        # Container healthcheck (loopback only).
        location = /__oblimint/ping {
            set $oblimint_kind default;
            set $oblimint_site "";
            set $oblimint_account "";
            set $oblimint_tenant "";
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
            default_type text/plain;
            return 200 "ok";
        }

        error_page 404 /__oblimint_edge/404.html;
        location ^~ /__oblimint_edge/ {
            internal;
            alias /usr/share/oblimint/errors/;
        }

        location / {
            set $oblimint_kind default;
            set $oblimint_site "";
            set $oblimint_account "";
            set $oblimint_tenant "";
            return 404;
        }
    }

    # ── Default HTTPS server: self-signed certificate (generated at start), 404 ──
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /run/oblimint-edge/default.crt;
        ssl_certificate_key /run/oblimint-edge/default.key;

        error_page 404 /__oblimint_edge/404.html;
        location ^~ /__oblimint_edge/ {
            internal;
            alias /usr/share/oblimint/errors/;
        }

        location / {
            set $oblimint_kind default;
            set $oblimint_site "";
            set $oblimint_account "";
            set $oblimint_tenant "";
            return 404;
        }
    }

    # Generated vhosts (module edge).
    include /etc/nginx/oblimint/conf.d/*.conf;
}
