# ─────────────────────────────────────────────────────────────────────────────
# oblimint-edge — shared reverse proxy (P1-PLAN §11, P4b-PLAN §8). Baked at
# /etc/nginx/nginx.conf: the LIVE configuration. The building blocks live in
# /etc/nginx/oblimint-base/ (main, events, http defaults + default servers,
# stream defaults) and are shared with the fallback configurations
# (base/good.conf, base/minimal.conf) and with the sandbox runs of the panel.
#
# The panel (module edge-robustness) only writes the UNITS, mounted read-only:
#   /etc/nginx/oblimint/global.d/*.conf   http{}-level units (maps, geo, zones)
#   /etc/nginx/oblimint/conf.d/*.conf     http server units (one per unit)
#   /etc/nginx/oblimint/stream.d/*.conf   stream units (approved ports only)
#   /etc/nginx/oblimint/aux/<unit>/       aux files (htpasswd, pages…)
# each one tested in isolation in a sandbox first, then runs
#   docker exec oblimint-edge nginx -t   then   oblimint-edge-reload
# The master is started by oblimint-edge-entrypoint with
# -c /run/oblimint-edge/active.conf, which includes this file (or a fallback).
#
# Main-level and events directives are written out here (the panel's tests
# read them: nofile limits) and repeated VERBATIM in base/main.conf and
# base/events.conf for the fallback / sandbox configurations — the panel's
# edge test suite checks that both copies stay identical.
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log stderr warn;
# File descriptors per worker: > 2 x worker_connections (a proxied request
# holds a client and an upstream socket). The container runs with
# nofile 65536:65536 (server specs.ts EDGE_NOFILE_LIMIT, keep >= this value):
# without CAP_SYS_RESOURCE nginx cannot raise its hard limit itself.
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/oblimint-base/http.conf;
    # Global units first (variables / zones the server units use).
    include /etc/nginx/oblimint/global.d/*.conf;
    # Server units (P1/P2 vhosts, mail contributors, proxy hosts, redirections, dead hosts, stubs).
    include /etc/nginx/oblimint/conf.d/*.conf;
}

stream {
    include /etc/nginx/oblimint-base/stream.conf;
    include /etc/nginx/oblimint/stream.d/*.conf;
}
