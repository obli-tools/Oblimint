# ─────────────────────────────────────────────────────────────────────────────
# oblimint-edge — main-level directives. Included by /etc/nginx/nginx.conf
# (live), base/good.conf (fallback on the last good copy), base/minimal.conf
# (defaults only) and every sandbox run of the panel
# (/etc/nginx/oblimint/sandbox/<run>/nginx.conf, docs/P4b-PLAN.md §8.3).
#
# Master as root (binds 80/443 + approved stream ports, reads the root-owned
# private keys), workers as `nginx`. Container: CapDrop ALL + CHOWN,
# NET_BIND_SERVICE, SETGID, SETUID; no-new-privileges; read-only root with
# tmpfs /var/cache/nginx, /run, /tmp.
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log stderr warn;
# File descriptors per worker: > 2 x worker_connections (a proxied request
# holds a client and an upstream socket). The container runs with
# nofile 65536:65536 (server specs.ts EDGE_NOFILE_LIMIT, keep >= this value):
# without CAP_SYS_RESOURCE nginx cannot raise its hard limit itself.
worker_rlimit_nofile 16384;
