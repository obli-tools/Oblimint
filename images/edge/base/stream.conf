# ─────────────────────────────────────────────────────────────────────────────
# oblimint-edge — stream{} defaults (TCP / UDP streams of proxy-hosts, units
# stream.d/st-<id>.conf on platform-approved ports only, ED5). Every
# proxy_pass of a stream goes through a variable resolved per connection.
# The stream module is built in the official nginx image (--with-stream,
# checked at build time by the Dockerfile): no load_module.
# Access log: ONE JSON object per session on stdout, kind "stream" (the panel
# attributes it by port: docs/P4b-PLAN.md §8.7).
# ─────────────────────────────────────────────────────────────────────────────

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

log_format oblimint_stream escape=json '{"time":"$time_iso8601","kind":"stream","remote_addr":"$remote_addr","protocol":"$protocol","port":"$server_port","status":$status,"bytes_sent":$bytes_sent,"bytes_received":$bytes_received,"session_time":$session_time,"upstream":"$upstream_addr","uct":"$upstream_connect_time"}';
access_log /dev/stdout oblimint_stream;
