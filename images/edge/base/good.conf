# ─────────────────────────────────────────────────────────────────────────────
# oblimint-edge — FALLBACK configuration (ED4): the image defaults + the last
# good copy written by the panel after every successful apply (edge/good/,
# mounted read-only at /etc/nginx/oblimint/good; aux paths already point to
# /etc/nginx/oblimint/good/aux/). Started by the entrypoint when the live
# configuration fails `nginx -t`; the next apply of the panel switches back
# to the live one (oblimint-edge-reload).
# ─────────────────────────────────────────────────────────────────────────────

include /etc/nginx/oblimint-base/main.conf;
events {
    include /etc/nginx/oblimint-base/events.conf;
}
http {
    include /etc/nginx/oblimint-base/http.conf;
    include /etc/nginx/oblimint/good/global.d/*.conf;
    include /etc/nginx/oblimint/good/conf.d/*.conf;
}
stream {
    include /etc/nginx/oblimint-base/stream.conf;
    include /etc/nginx/oblimint/good/stream.d/*.conf;
}
