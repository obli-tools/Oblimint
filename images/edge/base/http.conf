# ─────────────────────────────────────────────────────────────────────────────
# oblimint-edge — http{} defaults + default servers (P1-PLAN §11, P4b-PLAN §8).
# Included first in the http{} block of every configuration of the edge (live,
# fallback, sandbox runs); the panel's units follow: global.d/*.conf (maps,
# geo, zones: g-proxy, g-bans) then conf.d/*.conf (one file per unit).
# ─────────────────────────────────────────────────────────────────────────────

include /etc/nginx/mime.types;
default_type application/octet-stream;
server_tokens off;
sendfile on;
tcp_nopush on;
keepalive_timeout 65;

# Read-only root: temp files on the /var/cache/nginx tmpfs (512 MiB). The
# proxy cache of the proxy hosts (proxy_cache_path, global unit g-proxy) lives
# there too: bounded by its max_size, lost at restart (by design).
client_body_temp_path /var/cache/nginx/client_temp;
proxy_temp_path /var/cache/nginx/proxy_temp;
fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
scgi_temp_path /var/cache/nginx/scgi_temp;

# Long / numerous host names (one vhost per domain + www + previews).
# A name is up to 253 characters (panel SERVER_NAME_RE): one hash entry is
# ~264 bytes, so 128/256-byte buckets would fail `nginx -t` on a long name.
# Going past max_size does NOT fail `nginx -t`: ngx_hash_init() then only
# WARNS ("could not build optimal server_names_hash … ignoring
# server_names_hash_bucket_size") and builds a 65536-bucket hash anyway;
# EMERG needs one bucket chain > ~64 KB (millions of names). A high vhost
# count costs lookup speed, it cannot wedge the global configuration test.
server_names_hash_bucket_size 512;
server_names_hash_max_size 65536;
map_hash_bucket_size 128;

# Docker embedded DNS: EVERY proxy_pass of the units goes through a VARIABLE,
# resolved per request, so a stopped / missing upstream never breaks
# `nginx -t` (ED2).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# WebSocket upgrade (name used by the generated vhosts: keep it).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Access log: ONE JSON object per request on stdout ────────────────────────
# Contract docs/P2-PLAN.md §6.8 + P4b-PLAN.md §8.7 (produced here, parsed by
# the panel: services/usage/edgeLog.ts parseEdgeLogLine). Exact line:
#   {"time":"<ISO 8601>","host":"…","remote_addr":"…","method":"…","uri":"…",
#    "status":<int>,"bytes":<int body>,"bytes_sent":<int total>,
#    "request_length":<int>,"request_time":<float s>,"upstream":"…",
#    "upstream_status":"…","user_agent":"…","referer":"…","site":"<id>|",
#    "account":"<id>|","tenant":"<id>|","kind":"<kind>","ph":"<id>|",
#    "app":"<id>|","hp":"path|acl|","urt":"…","uct":"…","scheme":"http|https"}
# site / account / tenant / ph / app are decimal ids or ""; kind ∈ site |
# secondary | preview | panel | placeholder | dbadmin | probe | redirect |
# default | mail | webmail | proxy | proxy-redirect | dead | stub. The
# $oblimint_* variables are set (rewrite "set") in EVERY location of the
# generated units (server/src/services/edge/nginxConfig.ts, stub.ts, the
# proxy-hosts renderers) and of the default servers below — which also
# declares them for `nginx -t` when conf.d is empty. The internal error-page
# locations set nothing: an error_page redirect keeps the values of the
# location that failed.
uninitialized_variable_warn off;
log_format oblimint_json escape=json '{"time":"$time_iso8601","host":"$host","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"bytes_sent":$bytes_sent,"request_length":$request_length,"request_time":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status","user_agent":"$http_user_agent","referer":"$http_referer","site":"$oblimint_site","account":"$oblimint_account","tenant":"$oblimint_tenant","kind":"$oblimint_kind","ph":"$oblimint_host","app":"$oblimint_app","hp":"$oblimint_hp","urt":"$upstream_response_time","uct":"$upstream_connect_time","scheme":"$scheme"}';
access_log /dev/stdout oblimint_json;

# TLS defaults (Mozilla "intermediate"); vhosts repeat the protocols.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
# Same zone name / size as the generated vhosts (one shared cache).
ssl_session_cache shared:oblimint_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Ban variables ($oblimint_ban_p / $oblimint_ban_a) are NOT declared here:
# the global unit g-bans (honeypot-bans) declares them, with its
# fallbackConfig when it never passed — declaring them here too would be a
# duplicate geo variable. With an empty global.d nothing references them.

# ── Default HTTP server: ACME challenges, ping, then 404 ─────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        set $oblimint_kind default;
        set $oblimint_site "";
        set $oblimint_account "";
        set $oblimint_tenant "";
        set $oblimint_host "";
        set $oblimint_app "";
        set $oblimint_hp "";
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Container healthcheck + canary of the panel (loopback only).
    location = /__oblimint/ping {
        set $oblimint_kind default;
        set $oblimint_site "";
        set $oblimint_account "";
        set $oblimint_tenant "";
        set $oblimint_host "";
        set $oblimint_app "";
        set $oblimint_hp "";
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type text/plain;
        return 200 "ok";
    }

    error_page 404 /__oblimint_edge/404.html;
    location ^~ /__oblimint_edge/ {
        internal;
        alias /usr/share/oblimint/errors/;
    }

    location / {
        set $oblimint_kind default;
        set $oblimint_site "";
        set $oblimint_account "";
        set $oblimint_tenant "";
        set $oblimint_host "";
        set $oblimint_app "";
        set $oblimint_hp "";
        return 404;
    }
}

# ── Default HTTPS server: self-signed certificate (generated at start), 404 ──
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /run/oblimint-edge/default.crt;
    ssl_certificate_key /run/oblimint-edge/default.key;

    error_page 404 /__oblimint_edge/404.html;
    location ^~ /__oblimint_edge/ {
        internal;
        alias /usr/share/oblimint/errors/;
    }

    location / {
        set $oblimint_kind default;
        set $oblimint_site "";
        set $oblimint_account "";
        set $oblimint_tenant "";
        set $oblimint_host "";
        set $oblimint_app "";
        set $oblimint_hp "";
        return 404;
    }
}
