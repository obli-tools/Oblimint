# ─────────────────────────────────────────────────────────────────────────────
# oblimint-edge — LAST RESORT configuration: the image defaults only (ACME
# webroot, /__oblimint/ping, 404). Used by the entrypoint when neither the live
# configuration nor the last good copy passes `nginx -t`: the edge still
# starts (ACME keeps working) and the panel re-applies its configuration.
# ─────────────────────────────────────────────────────────────────────────────

include /etc/nginx/oblimint-base/main.conf;
events {
    include /etc/nginx/oblimint-base/events.conf;
}
http {
    include /etc/nginx/oblimint-base/http.conf;
}
stream {
    include /etc/nginx/oblimint-base/stream.conf;
}
