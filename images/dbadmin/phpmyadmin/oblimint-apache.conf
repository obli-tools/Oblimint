# ─────────────────────────────────────────────────────────────────────────────
# Oblimint — Apache of the shared phpMyAdmin (non-root, port 8080).
# The edge proxies https://<dbAdmin.hostname>/phpmyadmin/… with the full path:
# phpMyAdmin is served under /phpmyadmin/ (and at / for a direct probe).
# ─────────────────────────────────────────────────────────────────────────────
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Alias /phpmyadmin /var/www/html

<Directory /var/www/html>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Internal trees never served (their .htaccess are ignored: AllowOverride None).
<LocationMatch "^/(phpmyadmin/)?(setup|libraries|templates|vendor|sql|test|tmp|examples|doc)(/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "^(config\.inc\.php|oblimint-redeem\.php|composer\.(json|lock)|package\.json|yarn\.lock|RELEASE-DATE.*|ChangeLog|README|LICENSE)$">
    Require all denied
</FilesMatch>
