; Oblimint — PHP settings of the shared DB admin UIs (phpMyAdmin, Adminer).
; Read-only root: sessions and uploads on the /tmp tmpfs.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.save_path = "/tmp"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 7200
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 192M
max_execution_time = 300
allow_url_include = Off
; No URL wrappers (http://, ftp://) for file functions: the SSO redemption
; uses a raw socket (oblimint-redeem.php). Checked by the image builds.
allow_url_fopen = Off
