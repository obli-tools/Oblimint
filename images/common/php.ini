; ─────────────────────────────────────────────────────────────────────────────
; Oblimint site bases — production php.ini (installed as
; $PHP_INI_DIR/php.ini). Per-site values (memory_limit, upload/post sizes,
; max_execution_time) and the security settings (open_basedir, guard,
; sessions) are set in the php-fpm pool rendered by siteconf.
; ─────────────────────────────────────────────────────────────────────────────

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
; Many CMSs still call exec()/proc_open() (image tools, cron helpers): the
; container sandbox (read-only code, no capabilities, own network) is the
; boundary, not disable_functions.
disable_functions =
disable_classes =
zend.enable_gc = On
expose_php = Off

max_input_time = 60
max_input_vars = 3000
memory_limit = 256M

error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
; stderr of the worker → captured by php-fpm (catch_workers_output) → container logs.
error_log = /proc/self/fd/2
ignore_repeated_errors = On
html_errors = Off

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 64M
default_mimetype = "text/html"
default_charset = "UTF-8"

; Read-only root filesystem: temporary files and uploads go to the /tmp tmpfs.
sys_temp_dir = /tmp
upload_tmp_dir = /tmp
file_uploads = On
upload_max_filesize = 64M
max_file_uploads = 50

allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60

; Outgoing mail through msmtp. The per-site relay configuration arrives in P4:
; until then msmtp has no account, mail() returns false and the application
; reports its usual "could not send" error (nothing hangs, nothing crashes).
sendmail_path = "/usr/bin/msmtp -t"
mail.add_x_header = Off

[Date]
date.timezone = UTC

[Session]
session.save_handler = files
session.save_path = "/tmp/sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 1440

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Releases are immutable and oblimint-reload flushes opcache (php-fpm USR2)
; at every switch: a 2 s revalidation is only a safety net.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.file_cache =

[mbstring]
mbstring.language = neutral
