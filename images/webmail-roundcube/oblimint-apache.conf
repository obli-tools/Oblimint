# ─────────────────────────────────────────────────────────────────────────────
# Oblimint — Apache of the shared Roundcube (non-root, port 8080, code in
# /opt/roundcube, read-only). The edge proxies https://<webmail host>/.
# ─────────────────────────────────────────────────────────────────────────────
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /opt/roundcube>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>

# Internal trees never served (Roundcube's .htaccess is ignored: AllowOverride None).
<LocationMatch "^/(\.|bin|config|installer|logs|SQL|temp|tests?|vendor|program/(include|lib|localization|steps|actions)|plugins/[^/]+/(config|lib|localization|tests?|.*\.php$))(/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "(^\.|^(composer\.(json|lock)|package(-lock)?\.json|CHANGELOG.*|INSTALL|LICENSE|README.*|UPGRADING|SECURITY.*|jsdeps\.json)$|\.(sh|sql|dist|md|log|inc|ini)$)">
    Require all denied
</FilesMatch>
