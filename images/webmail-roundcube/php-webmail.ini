; Oblimint — PHP settings of the shared webmail (Roundcube / SnappyMail).
; Read-only root: sessions and uploads on the /tmp tmpfs. The message size
; comes from the container env (PHP expands ${VAR} in ini files); the edge
; bounds the request body (message size + 10 MiB) — post_max_size 0 = no
; second, stricter limit here.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.save_path = "/tmp"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
upload_max_filesize = ${OBLIMINT_MAX_MESSAGE_MB}M
post_max_size = 0
memory_limit = 192M
max_execution_time = 120
allow_url_include = Off
; No URL wrappers for file functions: the SSO client uses a raw socket.
allow_url_fopen = Off
